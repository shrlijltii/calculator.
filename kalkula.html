<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Lengkap</title>
    <style>
        body {
            display: grid;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'DM Mono', monospace;
            margin: 0;
        }
        .grid-container {
            display: grid;
            align-items: center;
            justify-content: center;
        }
        .calculator-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(6, 1fr);
            grid-gap: 1px;
            background-color: #999;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        textarea {
            grid-column: span 4;
            font-family: 'DM Mono', monospace;
            font-size: 25px;
            text-align: end;
            background-color: #fad3cb;
            padding: 15px;
            border: none;
            border-radius: 5px;
            resize: none;
            margin-bottom: 10px;
        }
        .calculator-grid button {
            font-family: 'DM Mono', monospace;
            font-size: 20px;
            background-color: #fff;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .calculator-grid button:nth-child(n+17) {
            background-color: tomato;
            color: white;
        }
        button:hover,
        .calculator-grid button:nth-child(n+17):hover {
            background-color: #440b15;
            color: white;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="calculator-grid">
            <textarea id="inputtext" placeholder="0" readonly></textarea>
            <button>C</button>
            <button>DEL</button>
            <button></button>
            <button>/</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>*</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button>=</button>
        </div>
    </div>

    <script>
        const input = document.getElementById('inputtext');
        const buttons = document.querySelectorAll('button');

        function calculate(expression) {
            try {
                return new Function('return ' + expression)();
            } catch (error) {
                return 'Error';
            }
        }

        function operation(buttonValue) {
            if (buttonValue === 'C') {
                input.value = '';
            } else if (buttonValue === 'DEL') {
                input.value = input.value.slice(0, -1);
            } else if (buttonValue === '=') {
                input.value = calculate(input.value);
            } else {
                input.value += buttonValue;
            }
        }

        buttons.forEach(button => {
            let buttonValue = button.innerText;
            button.addEventListener('click', function() {
                operation(buttonValue);
            });
        });
    </script>
</body>
</html>
